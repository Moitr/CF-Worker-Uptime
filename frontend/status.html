    :root { color-scheme:light; --ink:#161618; --muted:#787882; --line:#e4e4e7; --subtle:#f7f7f8; --up:#24c19a; --down:#f87171; --degraded:#fbbf24; --unknown:#cacace; }
    * { box-sizing:border-box; }
    body { margin:0; background:#fff; color:var(--ink); font-family:Inter,Arial,sans-serif; font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased; }
    button,input,select { font:inherit; }
    button,a { -webkit-tap-highlight-color:transparent; }
    button { cursor:pointer; }
    button:disabled { cursor:default; opacity:.35; }
    a { color:inherit; }
    button:focus-visible,a:focus-visible,select:focus-visible,[tabindex]:focus-visible { outline:2px solid #2463eb; outline-offset:4px; }
    [hidden] { display:none!important; }
    h1,h2,h3,p { margin:0; }
    h1 { font-size:24px; line-height:28px; font-weight:600; letter-spacing:-.8px; overflow-wrap:anywhere; }
    h2 { font-size:16px; line-height:24px; font-weight:500; }
    h3 { font-size:14px; font-weight:500; }
    .shell { width:100%; max-width:718px; padding:32px 24px 24px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; }
    .header { display:flex; gap:16px; align-items:center; justify-content:space-between; min-height:36px; margin-bottom:24px; }
    .brand { text-decoration:none; min-width:0; }
    .button { display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:6px 10px; line-height:20px; border:.5px solid #cacace; border-radius:6px; background:#fff; font-weight:500; text-decoration:none; transition:background .15s; }
    .button:hover { background:var(--subtle); }
    .primary { background:#29292f; border-color:#161618; color:#fff; flex-shrink:0; }
    .primary:hover { background:#39393f; }
    main { display:flex; flex-direction:column; gap:24px; }
    .card { border:1px solid var(--line); border-radius:8px; box-shadow:0 1px 2px #0000000d; overflow:hidden; background:#fff; }
    .card-heading { padding:13px 16px; border-bottom:1px solid var(--subtle); display:flex; gap:12px; align-items:center; justify-content:space-between; }
    .summary { --accent:var(--unknown); --tint:var(--subtle); border-color:var(--accent); }
    .summary[data-status="UP"] { --accent:var(--up); --tint:#d8f8f0; }
    .summary[data-status="DOWN"] { --accent:var(--down); --tint:#fee2e1; }
    .summary[data-status="DEGRADED"] { --accent:var(--degraded); --tint:#fef3c7; }
    .summary .card-heading { padding:16px; background:var(--tint); border:0; justify-content:flex-start; gap:9px; }
    .summary-icon { width:16px; height:16px; color:var(--accent); flex-shrink:0; }
    .summary p { padding:16px; }
    #systems > .card-heading { justify-content:flex-start; gap:16px; }
    .date-range { color:#95959d; font-size:14px; white-space:nowrap; }
    .service { padding:12px 16px 10px; }
    .group-status-icon { overflow:hidden; transition:width .65s ease, opacity .52s ease, margin .65s ease; }
    .group-uptime { max-width:180px; overflow:hidden; transition:max-width .65s ease, opacity .52s ease; }
    .service.expanded > .service-heading > .group-status-icon { width:0; opacity:0; margin-right:-8px; }
    .service.expanded > .service-heading > .group-uptime { max-width:0; opacity:0; }
    .service+.service { border-top:1px solid var(--subtle); }
    .service-heading { display:flex; align-items:center; min-height:28px; gap:8px; }
    .group-toggle { border:0; background:none; color:inherit; padding:0; text-align:left; display:flex; align-items:center; flex:1; gap:8px; min-width:0; min-height:28px; }
    .group-toggle:hover .component-count { color:#39393f; }
    .group-name { font-weight:500; overflow-wrap:anywhere; }
    .info-icon { display:inline-flex; align-items:center; justify-content:center; width:13px; height:13px; border:1px solid #95959d; border-radius:50%; font-size:9px; line-height:1; }
    .component-count { color:#95959d; font-size:14px; display:inline-flex; align-items:center; gap:4px; white-space:nowrap; }
    .chevron { width:12px; height:12px; transition:transform .65s ease; }
    [aria-expanded="true"] .chevron { transform:rotate(90deg); }
    .uptime { margin-left:auto; color:#95959d; font-size:14px; white-space:nowrap; }
    .indicator { width:16px; height:16px; flex-shrink:0; color:var(--unknown); }
    .indicator > .indicator { color:inherit; }
    [data-status="UP"]>.indicator { color:var(--up); }
    [data-status="DOWN"]>.indicator { color:var(--down); }
    [data-status="DEGRADED"]>.indicator { color:var(--degraded); }
    .bars { display:flex; gap:2px; height:16px; margin-top:4px; margin-bottom:4px; }
    .bar { flex:1 1 0; min-width:0; border:0; border-radius:1px; background:var(--unknown); padding:0; }
    .bar[data-status="UP"] { background:var(--up); }
    .bar[data-status="DOWN"] { background:var(--down); }
    .bar[data-status="DEGRADED"] { background:var(--degraded); }
    .bar:hover,.bar:focus-visible { opacity:.7; }
    .bar-meta { display:flex; flex-wrap:wrap; justify-content:space-between; column-gap:12px; font-size:11px; color:var(--muted); }
    .bar-meta .stale { color:#b45309; }
    .components { margin:4px -16px -12px; padding:0 16px; border-top:0; background:#fff; }
    .monitor { padding:8px 0 9px; }
    .monitor+.monitor { border-top:0; }
    .monitor .service-heading { gap:6px; flex-wrap:wrap; }
    .monitor-name { font-weight:500; overflow-wrap:anywhere; }
    .tag { border:1px solid var(--line); border-radius:4px; padding:0 5px; font-size:10px; color:var(--muted); max-width:100%; overflow-wrap:anywhere; }
    .monitor-meta { font-size:12px; color:var(--muted); margin-left:auto; }
    .text-button { border:0; background:none; color:var(--muted); padding:0; font-size:12px; text-decoration:underline; text-underline-offset:3px; }
    .monitor-error { color:#b42318; font-size:12px; overflow-wrap:anywhere; margin:4px 0; }
    .chart { margin-top:12px; padding:12px; border:1px solid var(--line); border-radius:6px; background:#fff; }
    .chart svg { display:block; width:100%; height:120px; }
    .chart-labels { display:flex; justify-content:space-between; color:var(--muted); font-size:11px; gap:8px; }
    .history-link { align-self:center; color:#5f5f68; }
    .icon { width:16px; height:16px; flex-shrink:0; }
    .footer { margin-top:auto; padding-top:40px; text-align:center; }
    .powered { display:inline-flex; gap:5px; align-items:center; flex-wrap:wrap; justify-content:center; font-size:12px; color:#95959d; margin-bottom:16px; }
    .powered a { text-decoration:none; color:#5f5f68; font-weight:600; }
    .disclaimer { font-size:12px; color:#95959d; text-align:center; padding:0 16px; }
    .notice { border:1px solid #fbbf24; border-radius:8px; padding:12px 16px; background:#fffbeb; }
    .notice button { margin-left:8px; }
    .empty { padding:24px 16px; color:var(--muted); text-align:center; }
    .incident-heading { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
    .incident { padding:16px; }
    .incident+.incident { border-top:1px solid var(--line); }
    .incident h3 { font-weight:600; }
    .incident p { margin-top:6px; color:var(--muted); font-size:12px; }
    .badge { font-size:11px; border-radius:4px; padding:2px 6px; background:var(--subtle); color:#5f5f68; white-space:nowrap; }
    .updates { margin-top:16px; padding-left:16px; border-left:2px solid var(--line); }
    .update+.update { margin-top:14px; }
    .update time { color:var(--muted); font-size:12px; }
    .update p { color:var(--ink); font-size:14px; }
    .history-controls { display:flex; gap:8px; align-items:center; color:#95959d; }
    .history-controls .button { border:0; background:transparent; padding:0 2px; color:#95959d; font-size:18px; line-height:20px; }
    .history-controls .button:hover { background:transparent; color:#5f5f68; }
    .history-controls button { padding:4px 8px; }
    .history-date { margin:16px 16px 0; color:var(--muted); font-size:12px; }
    .legend { display:flex; flex-wrap:wrap; justify-content:center; gap:16px; font-size:12px; color:var(--muted); }
    .legend span { display:inline-flex; align-items:center; gap:5px; }
    .dot { display:inline-block; width:7px; height:7px; border-radius:50%; }
    dialog { width:calc(100% - 32px); max-width:420px; border:1px solid var(--line); border-radius:12px; padding:24px; color:var(--ink); box-shadow:0 20px 60px #0003; }
    dialog::backdrop { background:#16161866; }
    .dialog-header { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:16px; }
    dialog p { color:var(--muted); margin-bottom:20px; }
    .close { background:none; border:0; font-size:24px; line-height:24px; padding:0 4px; color:var(--muted); }
    #subscription-message { margin:14px 0 0; font-size:12px; }
    .loading { padding:24px 16px; color:var(--muted); }
    @media(max-width:767px) {
      .shell { padding:24px 16px; }
      .header { gap:12px; }
      h1 { font-size:21px; }
      .primary { font-size:12px; }
      .card-heading { flex-wrap:wrap; gap:4px; }
      .date-range { font-size:12px; }
      .group-toggle { flex-wrap:wrap; column-gap:6px; row-gap:0; }
      .component-count { font-size:11px; }
      .uptime { display:none; }
      .bars { gap:1px; }
      .service { padding:16px; }
      .disclaimer { padding:0; }
      .footer { padding-top:32px; }
    }
    @media(prefers-reduced-motion:reduce) { * { transition:none!important; } }
  </style>
</head>
<body>
  <div class="shell">
    <header class="header">
      <a class="brand" href="#" aria-label="Status home"><h1 id="site-title">System Status</h1></a>

    </header>
    <main id="main">
      <div id="error" class="notice" role="alert" hidden></div>
      <div id="loading" class="card loading" role="status">Loading system status…</div>
      <section id="summary" class="card summary" aria-live="polite" hidden></section>
      <section id="active-incidents" class="card" aria-label="Active incidents" hidden></section>
      <section id="systems" class="card" aria-labelledby="systems-title" hidden>
        <div class="card-heading"><h2 id="systems-title">System status</h2><span class="date-range" id="date-range"></span></div>
        <div id="service-list"></div>
      </section>
    </main>
    <footer class="footer">
      <div class="powered">Powered by <a href="https://workers.cloudflare.com/" target="_blank" rel="noopener noreferrer">Cloudflare Workers</a><span aria-hidden="true">·</span><a href="https://github.com/Moitr/CF-Worker-Uptime" target="_blank" rel="noopener noreferrer" aria-label="CF-Worker-Uptime on GitHub">CF-Worker-Uptime on GitHub</a></div>
      <p class="disclaimer">Availability metrics are reported at an aggregate level across all monitored services. Individual service availability may vary.</p>
    </footer>
  </div>
  <noscript><p class="empty">Please enable JavaScript to view live system status.</p></noscript>
  <script>
    'use strict';
    const API_URL = '';
    const $ = id => document.getElementById(id);
    const escapeHTML = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const HOUR = 3600000;
    const DAY = 24 * HOUR;
    const state = { config:{}, groups:[], incidents:[], expanded:new Set(), chartOpen:new Set(), histories:new Map(), dayOffset:0, loaded:false, fetching:false, notifications:false, updatedAt:0, dataUpdatedAt:0, failures:0, retryAt:0 };
    const known = status => ['UP','DOWN','DEGRADED'].includes(status);
    const statusLabel = status => ({UP:'Operational',DOWN:'Outage',DEGRADED:'Degraded performance',UNKNOWN:'No data'}[status] || 'No data');
    const checkStatus = (check, monitor) => { if (!check || check.status === 'DOWN') return check?.status === 'DOWN' ? 'DOWN' : 'UNKNOWN'; if (check.status === 'DEGRADED' || Number(check.latency) > Number(monitor.expected_latency || Infinity)) return 'DEGRADED'; return 'UP'; };
    const statusOf = monitors => {
      const values = monitors.map(m => { const latest = (m.recent_checks||[]).slice().sort((a,b)=>b.timestamp-a.timestamp)[0]; return latest ? checkStatus(latest,m) : (m.state?.status || 'UNKNOWN'); });
      return values.includes('DOWN') ? 'DOWN' : values.includes('DEGRADED') ? 'DEGRADED' : !values.length || values.some(s => !known(s)) ? 'UNKNOWN' : 'UP';
    };
    const icon = (status, className = 'indicator') => `<svg class="${className}" viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="10" cy="10" r="8" fill="currentColor"/>${status === 'UP' ? '<path d="m6.5 10 2.3 2.3 4.7-4.8" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>' : '<path d="M10 5.5v5m0 2.5v.1" stroke="white" stroke-width="1.7" stroke-linecap="round"/>'}</svg>`;
    const chevron = '<svg class="chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m6 4 4 4-4 4"/></svg>';
    const formatDate = timestamp => new Date(timestamp).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
    const formatTime = timestamp => new Date(timestamp).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
    const completed = incident => ['resolved','completed'].includes(incident.status);
    const titleCase = text => String(text || '').replaceAll('_',' ').replace(/\b\w/g,c => c.toUpperCase());
    const safeURL = url => { try { const parsed = new URL(url); return ['https:','http:'].includes(parsed.protocol) ? escapeHTML(parsed.href) : ''; } catch { return ''; } };
    function getWindow(monitors = []) {
      const now = state.updatedAt || Date.now();
      const count = 84;
      const step = 10 * 60 * 1000;
      let latest = null;
      for (const monitor of monitors) {
        if (monitor.display?.history === false) continue;
        for (const check of monitor.recent_checks || []) {
          const timestamp = Number(check.timestamp);
          if (known(check.status) && Number.isFinite(timestamp) && timestamp > 0 && timestamp <= now && (latest === null || timestamp > latest)) latest = timestamp;
        }
      }
      const end = latest ?? now;
      return {start:end-count*step, end, count, step, latest, stale:latest !== null && now-latest > step};
    }
    function getBuckets(monitors) {
      const {start,end,count,step} = getWindow(monitors);
      const buckets = Array.from({length:count},(_,index) => ({time:start+index*step, checks:[]}));
      for (const monitor of monitors) {
        if (monitor.display?.history === false) continue;
        for (const check of monitor.recent_checks || []) {
          const timestamp = Number(check.timestamp);
          if (!Number.isFinite(timestamp) || timestamp < start || timestamp > end) continue;
          const index = Math.min(count-1, Math.floor((timestamp-start)/step));
          buckets[index].checks.push(check);
        }
      }
      return buckets.map(bucket => {
        const valid = bucket.checks.filter(check => known(check.status));
        return {...bucket, status:valid.some(c => c.status === 'DOWN')?'DOWN':valid.some(c => c.status === 'DEGRADED')?'DEGRADED':valid.length?'UP':'UNKNOWN', valid};
      });
    }
    function getUptime(monitors) {
      const checks = getBuckets(monitors).flatMap(bucket => bucket.valid);
      return checks.length ? `${(checks.filter(c => c.status === 'UP' || c.status === 'DEGRADED').length/checks.length*100).toFixed(2)}% uptime` : 'No data';
    }
    function bars(monitors) {
      const {start, step, end, latest, stale} = getWindow(monitors);
      const description = latest === null ? 'No recorded checks' : '14-hour status history; each capsule covers 10 minutes; right edge is the latest recorded check';
      const labels = latest === null ? '<span>No recorded checks</span>' : `<span>${escapeHTML(formatTime(start))}</span><span${stale ? ' class="stale"' : ''}>Last checked ${escapeHTML(formatTime(latest))}${stale ? ' · Updates delayed' : ''}</span>`;
      return `<div class="timeline"><div class="bars" aria-label="${description}">${getBuckets(monitors).map(bucket => {
        const label = `${formatTime(bucket.time)} – ${formatTime(bucket.time + step) + (latest !== null && bucket.time + step === end ? ' (latest check)' : '')} — ${statusLabel(bucket.status)}${bucket.valid.length ? ` · ${bucket.valid.length} recorded checks` : ''}`;
        return `<div class="bar" data-status="${bucket.status}" data-start="${bucket.time}" data-end="${bucket.time+step}" title="${escapeHTML(label)}" role="img" aria-label="${escapeHTML(label)}"></div>`;
      }).join('')}</div><div class="bar-meta">${labels}</div></div>`;
    }
    function renderSummary() {
      const excluded = state.config.settings?.summary_exclusion || [];
      const status = statusOf(state.groups.filter(g => !excluded.includes(g.id)).flatMap(g => g.monitors));
      const messages = {
        UP:['All services are operational','All monitored services are responding normally.'],
        DOWN:['Some services are unavailable','One or more monitored services are currently unreachable or failing checks.'],
        DEGRADED:['Some services are running slowly','One or more monitored services are responding slower than expected.'],
        UNKNOWN:['Waiting for status updates','There isn’t enough monitoring data yet to determine the status of all services.']
      };
      const [heading,description] = messages[status];
      $('summary').dataset.status = status;
      $('summary').innerHTML = `<div class="card-heading">${icon(status,'summary-icon')}<h2>${heading}</h2></div><p>${description}</p>`;
    }
    function tagsHTML(tags = []) {
      return tags.map(tag => {
        const name = typeof tag === 'string' ? tag : tag?.name || '';
        const definition = state.config.settings?.tags?.find(item => item.id === name);
        const label = definition?.label || name;
        const color = (typeof tag === 'object' && tag?.color) || definition?.color;
        const style = typeof color === 'string' && /^#[0-9a-f]{3,8}$/i.test(color)
          ? ` style="color:${escapeHTML(color)};border-color:${escapeHTML(color)}"` : '';
        return `<span class="tag"${style}>${escapeHTML(label)}</span>`;
      }).join('');
    }
    function monitorHTML(monitor) {
      const latest = (monitor.recent_checks || []).slice().sort((a,b)=>b.timestamp-a.timestamp)[0];
      const status = latest ? checkStatus(latest, monitor) : (known(monitor.state?.status) ? monitor.state.status : 'UNKNOWN');
      const uptime = getUptime([monitor]);
      const link = monitor.display?.public_link === true ? safeURL(monitor.url) : '';
      return `<div class="monitor"><div class="service-heading" data-status="${status}">${icon(status)}<span class="monitor-name">${link ? `<a href="${link}" target="_blank" rel="noopener noreferrer">${escapeHTML(monitor.name)}</a>` : escapeHTML(monitor.name)}</span>${tagsHTML(monitor.tags)}<span class="uptime" title="Percentage of recorded checks that were available (including degraded performance)">${uptime}</span></div>${monitor.display?.history !== false ? bars([monitor]) : ''}</div>`;
    }
    function renderGroups() {
      $('date-range').textContent = '14-hour history';
      $('service-list').innerHTML = state.groups.length ? state.groups.map((group,index) => {
        const status = statusOf(group.monitors);
        const expanded = state.expanded.has(group.id);
        const historyMonitors = group.monitors.filter(m => m.display?.history !== false);
        return `<article class="service${expanded ? ' expanded' : ''}"><div class="service-heading" data-status="${status}"><span class="indicator group-status-icon" title="${statusLabel(status)}" aria-label="${statusLabel(status)}">${icon(status)}</span><button class="group-toggle" data-group="${escapeHTML(group.id)}" aria-expanded="${expanded}" aria-controls="group-${index}"><span class="group-name">${escapeHTML(group.name)}</span><span class="component-count"><span class="info-icon" aria-hidden="true">i</span>${group.monitors.length} component${group.monitors.length === 1?'':'s'} ${chevron}</span></button><span class="uptime group-uptime" title="Percentage of recorded checks that were available (including degraded performance)">${historyMonitors.length?getUptime(historyMonitors):statusLabel(status)}</span></div>${historyMonitors.length?bars(historyMonitors).replace('class="timeline"', `class="timeline"${expanded?' hidden':''}`):''}<div class="components" id="group-${index}" ${expanded?'':'hidden'}>${group.monitors.map(m => monitorHTML(m)).join('')}</div></article>`;
      }).join('') : '<p class="empty">No services have been configured yet.</p>';
    }
    function incidentHTML(incident) {
      return `<article class="incident"><div class="incident-heading"><h3>${escapeHTML(incident.title)}</h3><span class="badge">${escapeHTML(titleCase(incident.status))}</span></div>${incident.start_time ? `<p>${escapeHTML(formatTime(incident.start_time))}${incident.end_time ? ' – '+escapeHTML(formatTime(incident.end_time)) : ''}</p>` : ''}${incident.routine_schedule ? `<p>Schedule: ${escapeHTML(incident.routine_schedule)}</p>` : ''}${incident.affected_monitors?.length ? `<p>Affected: ${incident.affected_monitors.map(id => escapeHTML(state.groups.flatMap(g => g.monitors).find(m => m.id === id)?.name || id)).join(', ')}</p>` : ''}${incident.updates?.length ? `<div class="updates">${[...incident.updates].sort((a,b) => new Date(b.timestamp)-new Date(a.timestamp)).map(update => `<div class="update"><time>${escapeHTML(formatTime(update.timestamp))}</time>${update.status ? ` <span class="badge">${escapeHTML(titleCase(update.status))}</span>` : ''}<p>${escapeHTML(update.message)}</p></div>`).join('')}</div>` : ''}</article>`;
    }
    function renderRoute() { $('summary').hidden = !state.loaded; $('systems').hidden = !state.loaded; }
    function render() {
      $('site-title').textContent = state.config.settings?.title || 'System Status';
      document.title = $('site-title').textContent;
      renderSummary(); renderGroups();
      $('active-incidents').innerHTML = '<div class="card-heading"><h2>Active incidents & maintenance</h2></div>'+state.incidents.filter(i => !completed(i)).map(incidentHTML).join('');
      renderRoute();
    }
    let refreshTimer;
    async function getJSON(path, withMetadata = false) {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(),15000);
      try {
        const response = await fetch(API_URL+path,{signal:controller.signal,cache:'no-store'});
        const retrySeconds = Number(response.headers.get('Retry-After')) || 0;
        const retryAt = retrySeconds > 0 ? Date.now() + retrySeconds * 1000 : 0;
        if (!response.ok) {
          const detail = await response.json().catch(() => ({}));
          const error = new Error(detail.code === 'D1_DAILY_LIMIT' || detail.error === 'D1_DAILY_LIMIT'
            ? 'Daily monitoring data quota reached.' : `Unable to load monitoring data (${response.status}).`);
          error.retryAt = Number(detail.retryAt) || retryAt;
          error.code = detail.error || detail.code;
          throw error;
        }
        const data = await response.json();
        return withMetadata ? {data, stale:response.headers.get('X-Status-Stale') === 'true',
          updatedAt:Number(response.headers.get('X-Status-Updated-At')) || Date.now(),
          code:response.headers.get('X-Status-Error'), retryAt} : data;
      } finally { clearTimeout(timeout); }
    }
    function scheduleRefresh() {
      clearTimeout(refreshTimer);
      if (!document.hidden) refreshTimer = setTimeout(fetchData, Math.max(60000, state.retryAt - Date.now()));
    }
    function showDataNotice(message, retryAt = 0) {
      $('error').textContent = message;
      if (retryAt > Date.now()) $('error').textContent += ` Next attempt: ${formatTime(retryAt)}.`;
      const retry = document.createElement('button');
      retry.className = 'text-button';
      retry.textContent = 'Retry';
      retry.disabled = retryAt > Date.now();
      retry.addEventListener('click', fetchData);
      $('error').appendChild(retry);
      $('error').hidden = false;
    }
    async function fetchData() {
      if (state.fetching || document.hidden) return;
      if (state.retryAt > Date.now()) { scheduleRefresh(); return; }
      state.fetching = true;
      try {
        const [config,statusResponse] = await Promise.all([getJSON('/api/config'),getJSON('/api/status', true)]);
        const groups = statusResponse.data;
        if (!Array.isArray(groups) || !groups.every(g => Array.isArray(g.monitors))) throw new Error('Invalid status response');
        const previous = new Map(state.groups.flatMap(g => g.monitors).map(m => [m.id,m.state?.status]));
        if (!statusResponse.stale && state.loaded && state.notifications && 'Notification' in window && Notification.permission === 'granted') {
          for (const monitor of groups.flatMap(g => g.monitors)) {
            if (previous.has(monitor.id) && previous.get(monitor.id) !== monitor.state?.status) {
              try { new Notification(`${monitor.name}: ${statusLabel(monitor.state?.status)}`,{body:`${config.settings?.title || 'System Status'} — Service status changed.`,tag:monitor.id}); } catch { state.notifications = false; }
            }
          }
        }
        state.config = config; state.groups = groups; state.incidents = config.incidents || [];
        state.loaded = true; state.updatedAt = Date.now(); state.dataUpdatedAt = statusResponse.updatedAt;
        state.failures = 0; state.retryAt = statusResponse.retryAt;
        $('error').hidden = true;
        render();
        if (statusResponse.stale) showDataNotice(`${statusResponse.code === 'D1_DAILY_LIMIT' ? 'Daily monitoring data quota reached.' : 'Unable to refresh monitoring data.'} Showing saved data from ${formatTime(state.dataUpdatedAt)}.`, state.retryAt);
      } catch (error) {
        state.failures++;
        state.retryAt = Math.max(Number(error.retryAt) || 0, Date.now() + Math.min(900000, 60000 * 2 ** Math.min(state.failures-1, 4)));
        const message = error.code === 'D1_DAILY_LIMIT' ? 'Daily monitoring data quota reached.' : 'Unable to load monitoring data.';
        showDataNotice(message + (state.loaded ? ` Showing saved data from ${formatTime(state.dataUpdatedAt || state.updatedAt)}.` : ''), state.retryAt);
      } finally { state.fetching = false; $('loading').hidden = true; scheduleRefresh(); }
    }
    function chartHTML(id) {
      const history = state.histories.get(id);
      if (!history) return '<p class="empty">Loading latency history…</p>';
      if (history.error) return '<p class="empty">Unable to load latency history. Close and reopen to retry.</p>';
      const points = history.filter(h => Number.isFinite(h.latency) && Number.isFinite(h.timestamp)).sort((a,b) => a.timestamp-b.timestamp);
      if (!points.length) return '<p class="empty">No latency measurements recorded.</p>';
      const max = Math.max(1,...points.map(p => p.latency));
      const start = points[0].timestamp;
      const span = Math.max(1,points[points.length-1].timestamp-start);
      const coords = points.map(p => `${8+(p.timestamp-start)/span*584},${108-p.latency/max*96}`).join(' ');
      return `<div class="chart-labels"><span>Latency (ms)</span><span>Peak ${max}ms</span></div><svg viewBox="0 0 600 120" role="img" aria-label="Latency history, peak ${max} milliseconds"><path d="M8 12H592M8 60H592M8 108H592" stroke="#e4e4e7" fill="none"/><polyline points="${coords}" fill="none" stroke="#24c19a" stroke-width="2" vector-effect="non-scaling-stroke"/>${points.length===1?`<circle cx="8" cy="${108-points[0].latency/max*96}" r="3" fill="#24c19a"/>`:''}</svg><div class="chart-labels"><span>${formatTime(start)}</span><span>${formatTime(points[points.length-1].timestamp)}</span></div>`;
    }
    // Keep the existing nodes so the heading can transition both directions.
    const disclosureAnimations = new WeakMap();
    function animateDisclosure(element, open) {
      if (!element) return;
      const previous = disclosureAnimations.get(element);
      const height = element.hidden ? 0 : element.getBoundingClientRect().height;
      const opacity = element.hidden ? 0 : Number(getComputedStyle(element).opacity);
      previous?.cancel();
      element.hidden = false;
      element.style.height = '';
      const targetHeight = element.getBoundingClientRect().height;
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        element.hidden = !open;
        element.style.overflow = '';
        disclosureAnimations.delete(element);
        return;
      }
      element.style.overflow = 'hidden';
      const animation = element.animate([
        {height:height+'px', opacity},
        {height:(open ? targetHeight : 0)+'px', opacity:open ? 1 : 0}
      ], {duration:650, easing:'ease', fill:'both'});
      disclosureAnimations.set(element, animation);
      animation.finished.then(() => {
        if (disclosureAnimations.get(element) !== animation) return;
        element.hidden = !open;
        animation.cancel();
        element.style.overflow = '';
        disclosureAnimations.delete(element);
      }).catch(() => {});
    }
    $('main').addEventListener('click',async event => {
      const group = event.target.closest('[data-group]');
      if (group) {
        const id = group.dataset.group;
        state.expanded.has(id) ? state.expanded.delete(id) : state.expanded.add(id);
        const open = state.expanded.has(id);
        const service = group.closest('.service');
        group.setAttribute('aria-expanded', String(open));
        service.classList.toggle('expanded', open);
        service.querySelector('.group-status-icon').setAttribute('aria-hidden', String(open));
        service.querySelector('.group-uptime').setAttribute('aria-hidden', String(open));
        const components = $(group.getAttribute('aria-controls'));
        components.inert = !open;
        animateDisclosure(service.querySelector(':scope > .timeline'), !open);
        animateDisclosure(components, open);
      }
      const day = event.target.closest('[data-day]');

      const chart = event.target.closest('[data-chart]');
      if (chart) {
        const id = chart.dataset.chart;
        state.chartOpen.has(id) ? state.chartOpen.delete(id) : state.chartOpen.add(id);
        const container = chart.nextElementSibling;
        container.hidden = !state.chartOpen.has(id);
        chart.setAttribute('aria-expanded',String(state.chartOpen.has(id)));
        chart.textContent = `${state.chartOpen.has(id)?'Hide':'Show'} latency chart`;
        if (state.chartOpen.has(id)) {
          if (!state.histories.has(id) || state.histories.get(id).error) {
            container.innerHTML = '<p class="empty">Loading latency history…</p>';
            try { const history = await getJSON('/api/history/'+encodeURIComponent(id)); if (!Array.isArray(history)) throw new Error('Invalid history'); state.histories.set(id,history); }
            catch { state.histories.set(id,{error:true}); }
          }
          container.innerHTML = chartHTML(id);
        }
      }
    });
    document.addEventListener('visibilitychange',() => {
      clearTimeout(refreshTimer);
      if (!document.hidden) fetchData();
    });
    fetchData();
  </script>
</body>
</html>
